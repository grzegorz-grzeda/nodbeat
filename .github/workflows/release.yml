name: Release

# A pushed tag vX.Y.Z tests, builds, publishes and deploys that version (ADR 0005).
# Run by hand with a version to redeploy an image that already exists (e.g. a rollback).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy, e.g. 0.9.0 (the image must already exist)
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/grzegorz-grzeda/nodbeat
  HEALTH_URL: https://nodbeat.g2labs.pl/health

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve and check version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            pkg="$(jq -r .version package.json)"
            if [ "$version" != "$pkg" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
              exit 1
            fi
            # Fail before deploying rather than after, when the Release is created.
            scripts/changelog-section.sh "$version" > /dev/null
          else
            version="${INPUT_VERSION#v}"
            # 0.10.0 is the first version with a published image.
            if [ "$(printf '%s\n' 0.10.0 "$version" | sort -V | head -1)" != 0.10.0 ]; then
              echo "::error::$version predates the release pipeline and has no image (need 0.10.0 or later)"
              exit 1
            fi
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not X.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push image
    if: github.event_name == 'push'
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy to the VPS
    needs: [version, build]
    # Runs after a successful build, or straight away for a manual redeploy (build skipped).
    if: ${{ !cancelled() && !failure() }}
    # One deploy at a time. Only on this job, so a queued tag still gets its image built.
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check the image exists
        run: docker manifest inspect "$IMAGE:$VERSION" > /dev/null
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Pull and restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "VERSION=$VERSION bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/nodbeat
          git fetch --tags --force
          git checkout --quiet "v$VERSION"
          # Keep the version in .env so plain `docker compose ...` commands work afterwards.
          if grep -q '^NODBEAT_VERSION=' .env; then
            sed -i "s/^NODBEAT_VERSION=.*/NODBEAT_VERSION=$VERSION/" .env
          else
            printf '\nNODBEAT_VERSION=%s\n' "$VERSION" >> .env
          fi
          docker compose pull
          docker compose up -d
          REMOTE
      - name: Wait for /health to report the new version
        run: |
          deadline=$(( $(date +%s) + 90 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            running="$(curl -fsS -m 5 "$HEALTH_URL" | jq -r .version 2>/dev/null || true)"
            if [ "$running" = "$VERSION" ]; then
              echo "$HEALTH_URL reports $VERSION"
              exit 0
            fi
            echo "waiting: running '${running:-unreachable}', want $VERSION"
            sleep 5
          done
          echo "::error::$HEALTH_URL did not report $VERSION within 90 s"
          exit 1

  release:
    name: GitHub Release
    if: github.event_name == 'push'
    needs: [version, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/changelog-section.sh "$VERSION" > notes.md
      - run: gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --verify-tag
