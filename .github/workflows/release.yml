name: Release

# A pushed tag vX.Y.Z tests, builds and publishes that version as :X.Y.Z and :latest (ADR 0006).
# The VPS pulls :latest once a day; nothing here touches the VPS.
# Run by hand with a version to point :latest back at an image that already exists (a rollback).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to make :latest, e.g. 0.12.0 (the image must already exist)
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/grzegorz-grzeda/nodbeat

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve and check version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            pkg="$(jq -r .version package.json)"
            if [ "$version" != "$pkg" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
              exit 1
            fi
            # Fail before deploying rather than after, when the Release is created.
            scripts/changelog-section.sh "$version" > /dev/null
          else
            version="${INPUT_VERSION#v}"
            # 0.10.0 is the first version with a published image.
            if [ "$(printf '%s\n' 0.10.0 "$version" | sort -V | head -1)" != 0.10.0 ]; then
              echo "::error::$version predates the release pipeline and has no image (need 0.10.0 or later)"
              exit 1
            fi
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not X.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push image
    if: github.event_name == 'push'
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  promote:
    name: Point :latest at an existing version
    if: github.event_name == 'workflow_dispatch'
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"

  release:
    name: GitHub Release
    if: github.event_name == 'push'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/changelog-section.sh "$VERSION" > notes.md
      - run: gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --verify-tag
