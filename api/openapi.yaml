# Hand-written (spec 0003). Served at /openapi.yaml with info.version set to the
# running version and servers set to PUBLIC_BASE_URL; the values below are placeholders.
openapi: 3.1.0
info:
  title: nodbeat
  version: 0.0.0
  description: |
    A heartbeat for every service and device.

    Each Monitor has a secret **Heartbeat URL**, `/hb/{token}`. Send a
    Heartbeat to it at least once per Interval; if none arrives within the
    Interval plus the Grace period, the Monitor goes Down and you get an Alert.
    A **Fail signal** to `/hb/{token}/fail` makes it Down at once. A
    **Start signal** to `/hb/{token}/start` says a job began: the next
    Heartbeat or Fail signal ends the **Run** and records its Run duration.

    Keep the Heartbeat URL secret: anyone who has it can send Heartbeats for
    the Monitor. Copy it from the Monitor page.
  license:
    name: MIT
servers:
  - url: http://localhost:3000
tags:
  - name: Heartbeat
    description: Send a Heartbeat to a Monitor's Heartbeat URL.
  - name: Health
    description: Whether this nodbeat instance is up.
  - name: Alerts
    description: Alerts nodbeat sends to your Alert channels.
webhooks:
  alert:
    post:
      tags: [Alerts]
      summary: Alert sent to a Webhook
      description: |
        nodbeat POSTs each Down and Up Alert to every Webhook among the
        Monitor's Alert channels (add one in Settings). Answer with any `2xx`
        within 5 s; anything else, including a redirect (never followed), is a
        failure. A failed Alert is retried with growing delays for 1 hour; then
        it is dropped and the Webhook is marked **Failing** in Settings, with
        the last error. It still gets later Alerts, and the next one delivered
        clears Failing.

        "Send test" in Settings sends a test Alert at once: `kind` `down`,
        `monitor.name` `Test Alert`, `monitor.url` the Settings page, and a
        `monitor.id` and `incidentId` that match no Monitor or Incident.

        With a secret set, verify each request: compute the HMAC-SHA256 of the
        raw request body with the secret as key, hex-encode it, and compare it
        (in constant time) with `X-Nodbeat-Signature` after its `sha256=`
        prefix. Reject requests that don't match.

        URLs whose host resolves to a private, loopback, link-local, CGNAT or
        unique-local address (IPv4 or IPv6) are refused, on save and before
        every send.
      operationId: alertWebhook
      parameters:
        - name: X-Nodbeat-Signature
          in: header
          required: false
          description: "`sha256=` and the hex HMAC-SHA256 of the raw body, keyed with the Webhook's secret. Only sent when a secret is set."
          schema:
            type: string
            pattern: "^sha256=[0-9a-f]{64}$"
          example: sha256=77325902caca812dc259733aacd046b73817372c777b8d95b402647474516e13
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookAlert"
            examples:
              down:
                summary: A Monitor went Down
                value:
                  monitor:
                    id: 6730c1f2a4b5c6d7e8f90123
                    name: Nightly backup
                    url: https://nodbeat.example.com/monitors/6730c1f2a4b5c6d7e8f90123
                  kind: down
                  at: "2026-11-11T03:01:30.000Z"
                  message: disk full
                  incidentId: 6731a0b1c2d3e4f5a6b7c8d9
              up:
                summary: The Monitor is Up again
                value:
                  monitor:
                    id: 6730c1f2a4b5c6d7e8f90123
                    name: Nightly backup
                    url: https://nodbeat.example.com/monitors/6730c1f2a4b5c6d7e8f90123
                  kind: up
                  at: "2026-11-11T03:20:02.000Z"
                  message: null
                  incidentId: 6731a0b1c2d3e4f5a6b7c8d9
      responses:
        "2XX":
          description: Received. Any `2xx` counts; the body is ignored.
paths:
  /hb/{token}:
    parameters:
      - $ref: "#/components/parameters/Token"
      - $ref: "#/components/parameters/Msg"
    get:
      tags: [Heartbeat]
      summary: Send a Heartbeat
      description: |
        Records a Heartbeat for the Monitor that owns this Heartbeat URL. The
        optional message comes from `?msg=`.

        At most one Heartbeat per second per Monitor is accepted. An IP that
        sends more than 30 requests a minute to unknown Heartbeat URLs gets
        429 on every Heartbeat URL for the rest of that minute.
      operationId: sendHeartbeat
      responses:
        "200":
          $ref: "#/components/responses/Recorded"
        "404":
          $ref: "#/components/responses/UnknownToken"
        "429":
          $ref: "#/components/responses/TooManyHeartbeats"
    post:
      tags: [Heartbeat]
      summary: Send a Heartbeat with a message
      description: |
        Records a Heartbeat for the Monitor that owns this Heartbeat URL, the
        same as GET. The optional message is taken from, in order:

        1. the `msg` query parameter (wins over any body);
        2. the body: a `text/plain` body, or a body with any other or no
           Content-Type, is the message itself; an `application/json` body's
           `msg` string; an `application/x-www-form-urlencoded` body's `msg`
           field.

        A broken JSON body is kept as plain text and still counts as a
        Heartbeat. The message is trimmed and cut to 200 characters; an
        empty message means none.

        The body may be at most 8 KiB. At most one Heartbeat per second per
        Monitor is accepted, and the same per-IP limit on unknown Heartbeat
        URLs as for GET applies.
      operationId: sendHeartbeatWithBody
      requestBody:
        $ref: "#/components/requestBodies/Message"
      responses:
        "200":
          $ref: "#/components/responses/Recorded"
        "404":
          $ref: "#/components/responses/UnknownToken"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "429":
          $ref: "#/components/responses/TooManyHeartbeats"
  /hb/{token}/start:
    parameters:
      - $ref: "#/components/parameters/Token"
      - $ref: "#/components/parameters/Msg"
    get:
      tags: [Heartbeat]
      summary: Send a Start signal
      description: |
        Says the job began, starting a Run. The next Heartbeat or Fail signal
        ends it, and its Run duration shows in the Heartbeats log, on the
        Monitor page and on the Dashboard. A second Start signal before then
        replaces the first. Its optional message is shown in the Heartbeats
        log only; it does not change the Monitor's last message.

        A Start signal is not a Heartbeat: it changes no Monitor state and does
        not move the Interval deadline, so a job that starts but never finishes
        still goes Down. A Start signal to a Paused Monitor is only recorded.

        At most one Start signal per second per Monitor is accepted, counted
        apart from Heartbeats and Fail signals, so a short job's Start signal
        and Heartbeat in the same second both get through. The per-IP limit on
        unknown Heartbeat URLs applies as for a Heartbeat.
      operationId: sendStartSignal
      responses:
        "200":
          $ref: "#/components/responses/Recorded"
        "404":
          $ref: "#/components/responses/UnknownToken"
        "429":
          $ref: "#/components/responses/TooManyHeartbeats"
    post:
      tags: [Heartbeat]
      summary: Send a Start signal with a message
      description: |
        The same as GET, with the message read as for a Heartbeat's POST:
        `?msg=` first, then the body. The body may be at most 8 KiB.
      operationId: sendStartSignalWithBody
      requestBody:
        $ref: "#/components/requestBodies/Message"
      responses:
        "200":
          $ref: "#/components/responses/Recorded"
        "404":
          $ref: "#/components/responses/UnknownToken"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "429":
          $ref: "#/components/responses/TooManyHeartbeats"
  /hb/{token}/fail:
    parameters:
      - $ref: "#/components/parameters/Token"
      - $ref: "#/components/parameters/Msg"
    get:
      tags: [Heartbeat]
      summary: Send a Fail signal
      description: |
        Says the job failed. A New or Up Monitor goes Down at once and a Down
        Alert says it reported a failure, with the message if there is one.
        A Fail signal to a Down or Paused Monitor is only recorded: no second
        Alert. Like a Heartbeat it shows the device is alive, so the Interval
        deadline counts from it; the next Heartbeat brings the Monitor Up.

        At most one Fail signal per second per Monitor is accepted, counted
        apart from Heartbeats. The per-IP limit on unknown Heartbeat URLs
        applies as for a Heartbeat.
      operationId: sendFailSignal
      responses:
        "200":
          $ref: "#/components/responses/Recorded"
        "404":
          $ref: "#/components/responses/UnknownToken"
        "429":
          $ref: "#/components/responses/TooManyHeartbeats"
    post:
      tags: [Heartbeat]
      summary: Send a Fail signal with a message
      description: |
        The same as GET, with the message read as for a Heartbeat's POST:
        `?msg=` first, then the body. The body may be at most 8 KiB.
      operationId: sendFailSignalWithBody
      requestBody:
        $ref: "#/components/requestBodies/Message"
      responses:
        "200":
          $ref: "#/components/responses/Recorded"
        "404":
          $ref: "#/components/responses/UnknownToken"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "429":
          $ref: "#/components/responses/TooManyHeartbeats"
  /health:
    get:
      tags: [Health]
      summary: Health of this nodbeat instance
      description: Answers 200 when nodbeat can reach its database, 503 when it can't. Point external uptime tools here.
      operationId: getHealth
      responses:
        "200":
          description: nodbeat is up and its database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                version: 1.2.3
                commit: abc1234
        "503":
          description: nodbeat is up but its database doesn't answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: mongo unavailable
                version: 1.2.3
                commit: abc1234
components:
  parameters:
    Token:
      name: token
      in: path
      required: true
      description: The secret part of the Monitor's Heartbeat URL, from the Monitor page. Regenerating the Heartbeat URL changes it.
      schema:
        type: string
      example: your-heartbeat-url-token
    Msg:
      name: msg
      in: query
      required: false
      description: An optional message stored with the Heartbeat, trimmed and cut to 200 characters. Wins over a body message.
      schema:
        type: string
      example: backup finished in 42 s
  requestBodies:
    Message:
      required: false
      content:
        text/plain:
          schema:
            type: string
            description: The message. Any other or no Content-Type is read the same way.
          example: backup finished in 42 s
        application/json:
          schema:
            type: object
            properties:
              msg:
                type: string
                description: The message.
          example:
            msg: backup finished in 42 s
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              msg:
                type: string
                description: The message.
          example:
            msg: backup finished in 42 s
  responses:
    Recorded:
      description: Heartbeat recorded.
      content:
        text/plain:
          schema:
            type: string
          example: OK
    UnknownToken:
      description: No Monitor has this Heartbeat URL, e.g. it was regenerated or the Monitor was deleted. Retrying won't help.
      content:
        text/plain:
          schema:
            type: string
          example: Not Found
    TooManyHeartbeats:
      description: |
        This Heartbeat wasn't recorded: either this Monitor got more than one
        Heartbeat in the last second, or the client's IP sent more than 30
        requests to unknown Heartbeat URLs in the last minute. While an IP is
        over that limit, every Heartbeat URL answers 429 to it, valid ones too,
        until the minute has passed.
      content:
        text/plain:
          schema:
            type: string
          example: Too Many Requests
    BodyTooLarge:
      description: The body is over 8 KiB; the Heartbeat wasn't recorded.
      content:
        text/plain:
          schema:
            type: string
          example: Payload Too Large
  schemas:
    Health:
      type: object
      required: [status, version, commit]
      properties:
        status:
          type: string
          enum: [ok, mongo unavailable]
        version:
          type: string
          description: The running nodbeat version.
        commit:
          type: string
          description: The commit it was built from, or `dev`.
    WebhookAlert:
      type: object
      description: The JSON body of an Alert POSTed to a Webhook.
      required: [monitor, kind, at, message, incidentId]
      properties:
        monitor:
          type: object
          required: [id, name, url]
          properties:
            id:
              type: string
              description: The Monitor's id.
            name:
              type: string
            url:
              type: string
              format: uri
              description: The Monitor page in nodbeat.
        kind:
          type: string
          enum: [down, up]
          description: "`down`: the Monitor went Down (missed its deadline, sent a Fail signal or ran longer than its Max run time). `up`: it is Up again."
        at:
          type: string
          format: date-time
          description: When the Monitor went Down (the Incident's start) or came Up (its end).
        message:
          type: [string, "null"]
          description: On a Down Alert, the last Heartbeat's or the Fail signal's message; null on Up Alerts or when there is none.
        incidentId:
          type: string
          description: The Incident; a Down Alert and the Up Alert that ends it share it.
