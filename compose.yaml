services:
  nodbeat:
    # Prebuilt by the release workflow; scripts/update.sh pulls the newest release once a day (ADR 0006).
    image: ghcr.io/grzegorz-grzeda/nodbeat:latest
    restart: unless-stopped
    env_file: .env
    # The Operator's Terms, Privacy policy and details (LEGAL_DIR=/legal); never in the repo or the image (ADR 0008).
    volumes:
      - ./legal:/legal:ro
    # No published ports: the shared edge Caddy reaches nodbeat:3000 over the edge network (ADR 0004).
    expose:
      - "3000"
    networks:
      - edge
    # Request logs hold visitor IPs: kept at most 14 days, as the Privacy policy says (spec 0019). json-file and local
    # only rotate by size, so logs go to journald, which the host drops after 14 days (docs/deploy.md, step 6).
    logging:
      driver: journald
      options:
        tag: nodbeat

networks:
  edge:
    external: true
