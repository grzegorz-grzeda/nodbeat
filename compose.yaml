services:
  nodbeat:
    # Prebuilt by the release workflow; scripts/update.sh pulls the newest release once a day (ADR 0006).
    image: ghcr.io/grzegorz-grzeda/nodbeat:latest
    restart: unless-stopped
    env_file: .env
    # No published ports: the shared edge Caddy reaches nodbeat:3000 over the edge network (ADR 0004).
    expose:
      - "3000"
    networks:
      - edge
    # Docker keeps container logs forever by default.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
